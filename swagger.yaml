swagger: "2.0"
info:
    title: HPlay API
    description: HPlay API documentation
    version: 0.0.1

basePath: /v1
tags:
    -   name: User
        description: User operations
    -   name: Media
        description: Media operations
    -   name: Tag
        description: Tag operations
    -   name: Payment
        description: Payment operations
securityDefinitions:
    Bearer:
        type: apiKey
        name: Authorization
        in: header
        description: 'Provide the JWT token in the format "Bearer {token}"'
paths:
    /user/register:
        post:
            tags:
                - User
            summary: Register a new user
            description: This endpoint allows you to register a new user.
            parameters:
                -   name: body
                    in: body
                    required: true
                    schema:
                        $ref: '#/definitions/RegisterRequest'
            responses:
                200:
                    description: User registered successfully
                    schema:
                        $ref: '#/definitions/UserResponse'
                400:
                    description: Bad request
                409:
                    description: Conflict
                500:
                    description: Internal server error
    /user/login:
        post:
            tags:
                - User
            summary: Login a user
            description: This endpoint allows you to login a user.
            parameters:
                -   name: body
                    in: body
                    required: true
                    schema:
                        $ref: '#/definitions/LoginRequest'
            responses:
                200:
                    description: User logged in successfully
                    schema:
                        $ref: '#/definitions/UserResponse'
                400:
                    description: Bad request
                401:
                    description: Unauthorized
                500:
                    description: Internal server error
    /user/verify-token:
        get:
            tags:
                - User
            summary: Verify user token
            description: This endpoint allows you to verify the user token.
            responses:
                200:
                    description: Token verified successfully
                    schema:
                        $ref: '#/definitions/User'
                401:
                    description: Unauthorized
                500:
                    description: Internal server error
            security:
                -   Bearer: [ ]
    /user/{id}/reset-password:
        post:
            tags:
                - User
            summary: Reset user password
            description: This endpoint allows you to reset the user password and send the new password by email.
            parameters:
                -   name: id
                    in: path
                    required: true
                    type: integer
                    description: The unique identifier of the user.
            responses:
                200:
                    description: Password reset successfully
                400:
                    description: Bad request
                401:
                    description: Unauthorized
                500:
                    description: Internal server error
            security:
                -   Bearer: [ ]
    /user/search:
        post:
            tags:
                - User
            summary: Search for users
            description: This endpoint allows you to search for users.
            parameters:
                -   name: body
                    in: body
                    required: false
                    schema:
                        properties:
                            query:
                                type: string
                                description: The search query.
                                required: false
            responses:
                200:
                    description: Users found successfully
                    schema:
                        type: array
                        items:
                            $ref: '#/definitions/User'
                400:
                    description: Bad request
                500:
                    description: Internal server error
            security:
                -   Bearer: [ ]
    /user/{id}:
        get:
            tags:
                - User
            summary: Get user information
            description: This endpoint allows you to get user information.
            parameters:
                -   name: id
                    in: path
                    required: true
                    type: integer
                    description: The unique identifier of the user.
            responses:
                200:
                    description: User found successfully
                    schema:
                        $ref: '#/definitions/User'
                401:
                    description: Unauthorized
                500:
                    description: Internal server error
            security:
                -   Bearer: [ ]
        put:
            tags:
                - User
            summary: Update user information
            description: This endpoint allows you to update user information.
            parameters:
                -   name: id
                    in: path
                    required: true
                    type: integer
                    description: The unique identifier of the user.
                -   name: body
                    in: body
                    required: true
                    schema:
                        $ref: '#/definitions/RegisterRequest'
            responses:
                200:
                    description: User updated successfully
                    schema:
                        $ref: '#/definitions/UserResponse'
                400:
                    description: Bad request
                401:
                    description: Unauthorized
                500:
                    description: Internal server error
            security:
                -   Bearer: [ ]
        delete:
            tags:
                - User
            summary: Delete a user
            description: This endpoint allows you to delete a user.
            parameters:
                -   name: id
                    in: path
                    required: true
                    type: integer
                    description: The unique identifier of the user.
            responses:
                200:
                    description: User deleted successfully
                401:
                    description: Unauthorized
                500:
                    description: Internal server error
            security:
                -   Bearer: [ ]
    
    /media/search:
        post:
            tags:
                - Media
            summary: Search for media
            description: This endpoint allows you to search for media.
            parameters:
                -   name: body
                    in: body
                    required: true
                    schema:
                        $ref: '#/definitions/SearchMediaRequest'
            responses:
                200:
                    description: Media found successfully
                    schema:
                        type: array
                        items:
                            $ref: '#/definitions/SearchMediaResponse'
                400:
                    description: Bad request
                500:
                    description: Internal server error
    /media/{id}:
        get:
            tags:
                - Media
            summary: Get media by ID
            description: This endpoint allows you to get media by its ID.
            parameters:
                -   name: id
                    in: path
                    required: true
                    type: integer
                    description: The unique identifier of the media.
            responses:
                200:
                    description: Media found successfully
                    schema:
                        $ref: '#/definitions/Media'
                400:
                    description: Bad request
                404:
                    description: Media not found
                500:
                    description: Internal server error
    /media:
        post:
            tags:
                - Media
            summary: Create a new media
            description: This endpoint allows you to create a new media.
            parameters:
                -   name: body
                    in: body
                    required: true
                    schema:
                        properties:
                            name:
                                type: string
                                description: The name of the media.
                                required: true
                            description:
                                type: string
                                description: A brief description of the media.
                            price:
                                type: number
                                format: float
                                description: The price of the media.
                            shareId:
                                type: string
                                description: The unique identifier of the share.
                            preview:
                                type: string
                                description: The URL of the media preview.
                            tags:
                                type: array
                                items:
                                    type: string
            responses:
                200:
                    description: Media created successfully
                    schema:
                        $ref: '#/definitions/Media'
                400:
                    description: Bad request
                500:
                    description: Internal server error
            security:
                -   Bearer: [ ]
    /media/{id}/upload:
        post:
            tags:
                - Media
            summary: Upload media
            description: This endpoint allows you to upload media.
            parameters:
                -   name: id
                    in: path
                    required: true
                    type: integer
                    description: The unique identifier of the media.
                -   name: file
                    in: formData
                    required: true
                    type: file
                    description: The media file to upload.
            responses:
                200:
                    description: Media uploaded successfully
                400:
                    description: Bad request
                404:
                    description: Media not found
                500:
                    description: Internal server error
            security:
                -   Bearer: [ ]
    /media/{id}/play:
        get:
            tags:
                - Media
            summary: Play media by ID
            description: This endpoint allows you to play media by its ID.
            parameters:
                -   name: id
                    in: path
                    required: true
                    type: integer
                    description: The unique identifier of the media.
            responses:
                200:
                    description: Media played successfully
                    schema:
                        type: object
                        properties:
                            url:
                                type: string
                                description: The URL of the media.
                                example: https://example.com/embed/123456?token=abcdef
                400:
                    description: Bad request
                404:
                    description: Media not found
                500:
                    description: Internal server error
            security:
                -   Bearer: [ ]
    /tag:
        get:
            tags:
                - Tag
            summary: Get all tags
            description: This endpoint allows you to get all tags.
            responses:
                200:
                    description: Tags found successfully
                    schema:
                        type: array
                        items:
                            $ref: '#/definitions/Tag'
                500:
                    description: Internal server error
            security:
                -   Bearer: [ ]
        post:
            tags:
                - Tag
            summary: Create a new tag
            description: This endpoint allows you to create a new tag.
            parameters:
                -   name: body
                    in: body
                    required: true
                    schema:
                        properties:
                            name:
                                type: string
                                description: The name of the tag.
                                required: true
            responses:
                200:
                    description: Tag created successfully
                    schema:
                        $ref: '#/definitions/Tag'
                400:
                    description: Bad request
                500:
                    description: Internal server error
            security:
                -   Bearer: [ ]
    /tag/{id}:
        get:
            tags:
                - Tag
            summary: Get tag by ID
            description: This endpoint allows you to get a tag by its ID.
            parameters:
                -   name: id
                    in: path
                    required: true
                    type: integer
                    description: The unique identifier of the tag.
            responses:
                200:
                    description: Tag found successfully
                    schema:
                        $ref: '#/definitions/Tag'
                400:
                    description: Bad request
                404:
                    description: Tag not found
                500:
                    description: Internal server error
            security:
                -   Bearer: [ ]
        put:
            tags:
                - Tag
            summary: Update tag by ID
            description: This endpoint allows you to update a tag by its ID.
            parameters:
                -   name: id
                    in: path
                    required: true
                    type: integer
                    description: The unique identifier of the tag.
                -   name: body
                    in: body
                    required: true
                    schema:
                        properties:
                            name:
                                type: string
                                description: The name of the tag.
                                required: true
            responses:
                200:
                    description: Tag updated successfully
                    schema:
                        $ref: '#/definitions/Tag'
                400:
                    description: Bad request
                404:
                    description: Tag not found
                500:
                    description: Internal server error
            security:
                -   Bearer: [ ]
        delete:
            tags:
                - Tag
            summary: Delete tag by ID
            description: This endpoint allows you to delete a tag by its ID.
            parameters:
                -   name: id
                    in: path
                    required: true
                    type: integer
                    description: The unique identifier of the tag.
            responses:
                200:
                    description: Tag deleted successfully
                400:
                    description: Bad request
                404:
                    description: Tag not found
                500:
                    description: Internal server error
            security:
                -   Bearer: [ ]
    /payment:
        post:
            tags:
                - Payment
            summary: Process a payment
            description: This endpoint allows you to process a payment.
            parameters:
                -   name: body
                    in: body
                    required: true
                    schema:
                        properties:
                            medias:
                                type: array
                                items:
                                    type: integer
                                description: The list of media IDs to purchase.
                                required: true
                            redirectUrl:
                                type: string
                                description: The URL to redirect to after payment.
                                required: true
            responses:
                200:
                    description: Payment processed successfully
                    schema:
                        type: object
                        properties:
                            url:
                                type: string
                                description: The URL to redirect to for payment.
                                example: https://payment.example.com/checkout?token=abcdef
                400:
                    description: Bad request
                500:
                    description: Internal server error
            security:
                -   Bearer: [ ]
    /payment/webhook:
        post:
            tags:
                - Payment
            summary: Payment webhook
            description: This endpoint allows you to receive payment notifications.
            parameters:
                -   name: body
                    in: body
                    required: true
                    schema:
                        properties:
                            status:
                                type: string
                                description: The status of the payment.
                                required: true
                            orderId:
                                type: string
                                description: The unique identifier of the order.
                                required: true
            responses:
                200:
                    description: Webhook received successfully
                400:
                    description: Bad request
                500:
                    description: Internal server error

definitions:
    Media:
        type: object
        properties:
            id:
                type: string
                description: The unique identifier of the media.
            name:
                type: string
                description: The name of the media.
            description:
                type: string
                description: A brief description of the media.
            price:
                type: number
                format: float
                description: The price of the media.
            shareId:
                type: string
                description: The unique identifier of the share.
            preview:
                type: string
                description: The URL of the media preview.
            tags:
                type: array
                items:
                    type: string
                description: The tags associated with the media.
    User:
        type: object
        properties:
            id:
                type: string
                description: The unique identifier of the user.
            email:
                type: string
                format: email
                description: The email of the user.
            firstName:
                type: string
                description: The firstname of the user.
            lastName:
                type: string
                description: The lastname of the user.
            isAdmin:
                type: boolean
                description: Whether the user is an admin or not.
            isContributor:
                type: boolean
                description: Whether the user is a contributor or not.
    Tag:
        type: object
        properties:
            id:
                type: string
                description: The unique identifier of the tag.
            name:
                type: string
                description: The name of the tag.
    RegisterRequest:
        type: object
        properties:
            email:
                type: string
                format: email
                description: The email of the user.
                required: true
            password:
                type: string
                format: password
                description: The password of the user (6 characters minimum).
                required: true
            firstName:
                type: string
                description: The firstname of the user.
                required: true
            lastName:
                type: string
                description: The lastname of the user.
                required: true
    LoginRequest:
        type: object
        properties:
            email:
                type: string
                format: email
                description: The email of the user.
                required: true
            password:
                type: string
                format: password
                description: The password of the user (6 characters minimum).
                required: true
    SearchMediaRequest:
        type: object
        properties:
            name:
                type: string
                description: The name of the media to search for.
                required: false
            limit:
                type: integer
                description: The maximum number of results to return.
                example: 10
                required: false
            page:
                type: integer
                description: The page number to return.
                example: 1
                required: false
            tags:
                type: array
                items:
                    type: string
                description: The tags to filter the media by.
                required: false
    SearchMediaResponse:
        type: object
        properties:
            total:
                type: integer
                description: The total number of media found.
                example: 100
            startAt:
                type: integer
                description: The starting index of the media found.
                example: 1
            limit:
                type: integer
                description: The maximum number of results returned.
                example: 10
            medias:
                type: array
                items:
                    $ref: '#/definitions/Media'
    GetMediaRequest:
        type: object
        properties:
            id:
                type: string
                description: The unique identifier of the media.
    UserResponse:
        type: object
        properties:
            jwtToken:
                type: object
                properties:
                    token:
                        type: string
                        description: The JWT token for the user.
                        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                    expire:
                        type: integer
                        description: The timestamp when the token expires.
                        example: 1746560493
            user:
                $ref: '#/definitions/User'
    